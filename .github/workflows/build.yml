name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build dotnet/CodexSplash.csproj -c Release

      - name: Publish
        run: dotnet publish dotnet/CodexSplash.csproj -c Release -o out/CodexSplash

      - name: Assemble package
        shell: pwsh
        run: |
          $dest = 'out/CodexSplash'
          Copy-Item 'launcher.json'            $dest
          Copy-Item '创建桌面快捷方式.vbs'      $dest
          Copy-Item '设置面板.bat'              $dest
          Copy-Item '查看日志.bat'              $dest
          Copy-Item 'README.md'                $dest
          Copy-Item 'LICENSE'                  $dest
          Copy-Item 'THIRD-PARTY-NOTICES.md'   $dest
          Copy-Item 'assets'                   $dest -Recurse -Force
          Copy-Item 'media'                    $dest -Recurse -Force
          Compress-Archive -Path "$dest/*" -DestinationPath 'out/CodexSplash-win-x64.zip' -Force
          Get-Item 'out/CodexSplash-win-x64.zip' | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexSplash-win-x64
          path: out/CodexSplash-win-x64.zip
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/CodexSplash-win-x64.zip
          generate_release_notes: true
